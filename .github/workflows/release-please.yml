name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The applogico org disables write for the default GITHUB_TOKEN, so
      # release-please authenticates with the RELEASE_PLEASE_TOKEN secret
      # (a fine-grained PAT / App token with Contents + Pull requests: RW).
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Gated on release_created, so an ordinary push to main does nothing here —
  # only the merge of a release PR reaches this job.
  store-zips:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Build from the tag, not from main, so the zips match what was released.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Name the zips after the release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mv dist/blipr-chrome.zip "dist/blipr-chrome-${TAG}.zip"
          mv dist/blipr-firefox.zip "dist/blipr-firefox-${TAG}.zip"
      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/blipr-chrome-"$TAG".zip dist/blipr-firefox-"$TAG".zip --clobber
